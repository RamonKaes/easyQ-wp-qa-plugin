name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Coding standards and static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
      - run: composer install --no-interaction --no-progress
      - run: composer lint
      - run: composer analyse
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint:js
      - run: npm run lint:md
      - run: npm run lint:pkg-json

  unit:
    name: Unit tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: composer install --no-interaction --no-progress
      - run: composer test:unit

  integration:
    name: Integration (WP ${{ matrix.wp }}, PHP ${{ matrix.php }}${{ matrix.multisite && ', multisite' || '' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        wp: ['6.7', 'latest']
        php: ['8.1', '8.4']
        multisite: [false, true]
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
      - run: composer install --no-interaction --no-progress
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Configure WordPress version
        run: |
          if [ "${{ matrix.wp }}" = "latest" ]; then CORE=null; else CORE='"WordPress/WordPress#${{ matrix.wp }}"'; fi
          echo "{ \"core\": $CORE, \"phpVersion\": \"${{ matrix.php }}\" }" > .wp-env.override.json
      - run: npm run env:start
      - run: npm run test:php
        if: ${{ ! matrix.multisite }}
      - run: npm run test:php:multisite
        if: ${{ matrix.multisite }}

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - run: npm run env:start
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-artifacts
          path: artifacts
          retention-days: 7

  plugin-check:
    name: Plugin Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build release archive
        run: |
          npm run plugin-zip
          unzip -q easyq.zip -d dist
      - uses: WordPress/plugin-check-action@v1
        with:
          build-dir: dist/easyq
