# Checks every push to main and every pull request: Markdown lint, coding standards, static
# analysis, unit, integration and end-to-end tests, and Plugin Check on the release archive.
# Commits that only change Markdown run the Markdown lint alone; the other jobs are skipped.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push cancels the run of the older one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    # The plugin folder must be called `easyq`: it is the plugin slug and the text domain.
    working-directory: easyq

jobs:
  changes:
    name: Changed files
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.files.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: easyq
          fetch-depth: 0
      # Code changed unless every changed file is Markdown. Without a known base (a new
      # branch or a force push) everything runs.
      - id: files
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if ! git cat-file -e "$BASE^{commit}" 2> /dev/null; then
            code=true
          elif git diff --name-only "$BASE" HEAD | grep -qv '\.md$'; then
            code=true
          else
            code=false
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  lint-md:
    name: Markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: easyq
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: easyq/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint:md

  lint:
    name: Coding standards and static analysis
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: easyq
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - uses: ramsey/composer-install@v3
        with:
          working-directory: easyq
      - run: composer lint
      - run: composer analyse
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: easyq/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint:js
      - run: npm run lint:pkg-json

  unit:
    name: Unit tests (PHP ${{ matrix.php }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v7
        with:
          path: easyq
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - uses: ramsey/composer-install@v3
        with:
          working-directory: easyq
      - run: composer test:unit

  integration:
    name: Integration (WP ${{ matrix.wp }}, PHP ${{ matrix.php }}${{ matrix.multisite && ', multisite' || '' }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every supported PHP version with the latest WordPress, and the oldest supported
        # combination: WordPress 6.7 with PHP 8.2.
        include:
          - { wp: latest, php: '8.2', multisite: false }
          - { wp: latest, php: '8.2', multisite: true }
          - { wp: latest, php: '8.3', multisite: false }
          - { wp: latest, php: '8.3', multisite: true }
          - { wp: latest, php: '8.4', multisite: false }
          - { wp: latest, php: '8.4', multisite: true }
          - { wp: latest, php: '8.5', multisite: false }
          - { wp: latest, php: '8.5', multisite: true }
          - { wp: '6.7', php: '8.2', multisite: false }
          - { wp: '6.7', php: '8.2', multisite: true }
    steps:
      - uses: actions/checkout@v7
        with:
          path: easyq
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - uses: ramsey/composer-install@v3
        with:
          working-directory: easyq
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: easyq/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Start the test environment
        run: |
          if [ "${{ matrix.wp }}" = latest ]; then core=null; else core='"WordPress/WordPress#${{ matrix.wp }}"'; fi
          echo "{ \"core\": $core, \"phpVersion\": \"${{ matrix.php }}\" }" > .wp-env.test.override.json
          npx wp-env start --config=.wp-env.test.json
      - run: npm run test:php
        if: ${{ ! matrix.multisite }}
      - run: npm run test:php:multisite
        if: ${{ matrix.multisite }}

  e2e:
    name: End-to-end tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: easyq
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: easyq/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npx playwright install chromium --with-deps
      - run: npx wp-env start --config=.wp-env.test.json
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-artifacts
          path: easyq/artifacts
          retention-days: 7

  plugin-check:
    name: Plugin Check
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: easyq
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: easyq/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Build the release archive
        run: |
          npm run build
          npm run plugin-zip
          unzip -q easyq.zip -d dist
      # Checks exactly what is published on wordpress.org; warnings fail the run as well.
      - uses: WordPress/plugin-check-action@v1
        # wp-env of the action uses this PHP version: the minimum of easyQ.
        env:
          WP_ENV_PHP_VERSION: '8.2'
        with:
          build-dir: easyq/dist/easyq
          include-experimental: true
          strict: true
